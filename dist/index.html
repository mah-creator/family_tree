z-index:250}.search-results-dropdown.active{display:block}.search-result-item{padding:10px 16px;border-bottom:1px solid rgba(197,160,89,.2);cursor:pointer;transition:background .15s ease}.search-result-item:hover{background:#c5a0592e}.search-result-name{font-weight:700;font-size:14.5px;color:var(--text-dark)}.search-result-lineage{font-size:12px;color:#6a5242;margin-top:2px}.controls-widget{position:absolute;bottom:24px;right:24px;z-index:200;display:flex;gap:10px}.control-btn{background:#fdfbf7eb;border:1.5px solid var(--gold-primary);border-radius:12px;padding:8px 14px;font-family:var(--font-arabic);font-size:13px;font-weight:600;color:var(--text-dark);cursor:pointer;box-shadow:0 4px 12px #00000026;transition:all .2s ease}.control-btn:hover{background:var(--gold-primary);color:#fff}.profiler-card{position:absolute;bottom:70px;right:24px;width:320px;background:#140f0aeb;color:#f7e7ad;border:1px solid var(--gold-primary);border-radius:14px;padding:14px 18px;font-size:12.5px;box-shadow:0 8px 24px #00000080;z-index:210;display:none}.profiler-card.active{display:block}#tree-svg{width:100%;height:100%;cursor:grab}#tree-svg:active{cursor:grabbing}.trunk-oval{fill:url(#goldTrunkGradient);stroke:#8c6a27;stroke-width:2.5px;stroke-width:3px}.trunk-text-name{font-weight:800;font-size:16px;fill:#3d2800}.trunk-text-bio{font-weight:500;font-size:10.5px;fill:#5e410a}.founder-circle{fill:url(#goldFounderGradient);stroke:#a32a2a;stroke-width:2px;stroke-width:2.5px}.founder-text{font-weight:700;font-size:11.5px;fill:#4a0e0e}.leaf-sway{transform-origin:0px 0px;animation:leafSway 4s ease-in-out infinite alternate}@keyframes leafSway{0%{transform:rotate(0)}50%{transform:rotate(2.5deg)}to{transform:rotate(-2.5deg)}}@keyframes branchDraw{0%{stroke-dashoffset:1000;opacity:0}to{stroke-dashoffset:0;opacity:1}}@keyframes leafAppear{0%{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}@keyframes nodePop{0%{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}</style>
</head>
<body>
  <div id="app">
    <!-- Fixed Ornate Frame & Corner Cartouches Overlay -->
    <div class="ornate-frame-overlay">
      <div class="cartouche cartouche-top-right">ما شاء الله لا قوة إلا بالله</div>
      <div class="cartouche cartouche-top-left">تبارك الله أحسن الخالقين</div>
    </div>

    <!-- Floating Glassmorphism Search Panel -->
    <div class="ui-panel-overlay">
      <div class="search-box-wrapper">
        <input type="text" id="search-input" class="search-input" placeholder="ابحث عن اسم في المشجرة (مثال: عبدالله، حسن، bq...)" autocomplete="off">
      </div>
      <div id="search-results" class="search-results-dropdown"></div>
    </div>

    <!-- Floating Controls & Profiler Widget -->
    <div class="controls-widget">
      <button id="btn-single-limb" class="control-btn" style="border-color: #2D6A4F; font-weight: 700;">عرض الشجرة كاملة (181 أصل)</button>
      <button id="btn-benchmark" class="control-btn">اختبار 2000 أصل (Stress Test)</button>
      <button id="btn-reset-cam" class="control-btn">إعادة الضبط</button>
      <button id="btn-profiler" class="control-btn">تقرير الأداء (Profiler)</button>
      <button id="btn-debug" class="control-btn">طبقة الفحص (Debug)</button>
    </div>

    <!-- Performance Profiler Card -->
    <div id="profiler-card" class="profiler-card">
      <div style="font-weight: 700; margin-bottom: 8px; border-bottom: 1px solid var(--gold-primary); padding-bottom: 4px;">
        📊 تقرير أداء العرض (Browser Profiler)
      </div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
        <span>عدد العقد الكلي:</span>
        <strong id="prof-node-count">181</strong>
      </div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
        <span>العقد المرئية (Viewport):</span>
        <strong id="prof-visible-count">181</strong>
      </div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
        <span>أقصى زمن إطار (Max Frame):</span>
        <strong id="prof-max-frame" style="color: #52B788;">11.2 ms (89 FPS)</strong>
      </div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
        <span>نصوص LOD مفعّلة:</span>
        <strong id="prof-text-lod">نعم</strong>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span>حركة الأوراق (Sway):</span>
        <strong id="prof-sway-status">مفعلة</strong>
      </div>
    </div>

    <!-- SVG Canvas -->
    <svg id="tree-svg">
      <defs>
        <!-- Trunk Oval Gold Gradient -->
        <linearGradient id="goldTrunkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFF3C4" />
          <stop offset="50%" stop-color="#F2CB6E" />
          <stop offset="100%" stop-color="#C59332" />
        </linearGradient>

        <!-- Founder Medallion Gold Gradient -->
        <radialGradient id="goldFounderGradient" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFF8DF" />
          <stop offset="65%" stop-color="#E5B242" />
          <stop offset="100%" stop-color="#9A6F19" />
        </radialGradient>

        <!-- Standard Emerald Leaf Gradient -->
        <linearGradient id="emeraldLeafGradient" x1="0%" y1="0%" x2="100%" y2="50%">
          <stop offset="0%" stop-color="#52B788" />
          <stop offset="60%" stop-color="#2D6A4F" />
          <stop offset="100%" stop-color="#1B4332" />
        </linearGradient>

        <!-- Distinguished Gold Leaf Gradient -->
        <linearGradient id="goldLeafGradient" x1="0%" y1="0%" x2="100%" y2="50%">
          <stop offset="0%" stop-color="#FFEAA7" />
          <stop offset="60%" stop-color="#D4AC0D" />
          <stop offset="100%" stop-color="#7D6608" />
        </linearGradient>

        <!-- Wood Limb Gradient -->
        <linearGradient id="woodLimbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7A5230" />
          <stop offset="50%" stop-color="#4A2E19" />
          <stop offset="100%" stop-color="#2D1A0E" />
        </linearGradient>
      </defs>

      <g id="tree-zoom-container">
        <!-- Branches Layer -->
        <g id="branches-layer"></g>
        <!-- Nodes Layer -->
        <g id="nodes-layer"></g>
        <!-- Debug Overlay Layer (wedges, canopy bands, trunk attachment points) -->
        <g id="debug-layer" style="display: none; pointer-events: none;"></g>
      </g>
    </svg>
  </div>

</body>
</html>
